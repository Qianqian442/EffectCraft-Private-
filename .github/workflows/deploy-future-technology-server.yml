name: Deploy 未来科技 account server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require private Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FUTURE_TECH_D1_DATABASE_ID: ${{ secrets.FUTURE_TECH_D1_DATABASE_ID }}
          FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD }}
          FUTURE_TECH_WORKER_URL: ${{ vars.FUTURE_TECH_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FUTURE_TECH_D1_DATABASE_ID"
          test "${#FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD}" -ge 12
          test -n "$FUTURE_TECH_WORKER_URL"

      - name: Install pinned Wrangler
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Configure private D1 database id without committing it
        working-directory: server
        env:
          FUTURE_TECH_D1_DATABASE_ID: ${{ secrets.FUTURE_TECH_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          sed -i "s/00000000-0000-0000-0000-000000000000/$FUTURE_TECH_D1_DATABASE_ID/" wrangler.toml

      - name: Apply D1 migrations
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply future-tech-accounts --remote

      - name: Set one-time administrator bootstrap password as a Cloudflare secret
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD" | npx wrangler secret put ADMIN_BOOTSTRAP_PASSWORD

      - name: Deploy Worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "${{ vars.FUTURE_TECH_WORKER_URL }}/health"
