name: Deploy 未来科技 account server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Require private Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FUTURE_TECH_D1_DATABASE_ID: \${{ secrets.FUTURE_TECH_D1_DATABASE_ID }}
          FUTURE_TECH_JWT_SECRET: \${{ secrets.FUTURE_TECH_JWT_SECRET }}
          FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD: \${{ secrets.FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD }}
          FUTURE_TECH_WORKER_URL: \${{ vars.FUTURE_TECH_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FUTURE_TECH_D1_DATABASE_ID"
          test "\${#FUTURE_TECH_JWT_SECRET}" -ge 64
          test "\${#FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD}" -ge 12
          test -n "$FUTURE_TECH_WORKER_URL"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create private Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FUTURE_TECH_D1_DATABASE_ID: \${{ secrets.FUTURE_TECH_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          cp server/cloudflare/wrangler.toml.example server/cloudflare/wrangler.toml
          sed -i "s/REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID/$CLOUDFLARE_ACCOUNT_ID/" server/cloudflare/wrangler.toml
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$FUTURE_TECH_D1_DATABASE_ID/" server/cloudflare/wrangler.toml
          ! grep -q 'REPLACE_WITH_' server/cloudflare/wrangler.toml

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.46.0

      - name: Verify required R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler r2 bucket list | grep -F 'future-tech-avatars'

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute future-tech-accounts --remote --file=server/cloudflare/schema.sql --config server/cloudflare/wrangler.toml

      - name: Set private Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FUTURE_TECH_JWT_SECRET: \${{ secrets.FUTURE_TECH_JWT_SECRET }}
          FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD: \${{ secrets.FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$FUTURE_TECH_JWT_SECRET" | wrangler secret put JWT_SECRET --config server/cloudflare/wrangler.toml
          printf '%s' "$FUTURE_TECH_ADMIN_BOOTSTRAP_PASSWORD" | wrangler secret put ADMIN_BOOTSTRAP_PASSWORD --config server/cloudflare/wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config server/cloudflare/wrangler.toml

      - name: Verify HTTPS health endpoint
        env:
          FUTURE_TECH_WORKER_URL: \${{ vars.FUTURE_TECH_WORKER_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$FUTURE_TECH_WORKER_URL/api/v1/health"
