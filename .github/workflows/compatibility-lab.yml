name: Compatibility lab checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility lab
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile inspector and test scripts
        run: python -m py_compile tools/inspect_plugin.py tools/validate_sources.py tests/test_inspect_plugin.py tests/test_sources_lock.py
      - name: Run binary-header tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned source registry and licensing policy
        run: python tools/validate_sources.py
      - name: Validate project IR schema JSON
        run: python -m json.tool schemas/project-ir.schema.json > /dev/null
      - name: Ensure inspector is read-only and never marks input executable
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from tools.inspect_plugin import inspect
          with tempfile.NamedTemporaryFile() as f:
              f.write(b"\x00asm\x01\x00\x00\x00")
              f.flush()
              result = inspect(Path(f.name))
          assert result["format"] == "WebAssembly", result
          assert result["safe_to_execute"] is False, result
          print("Read-only inspection guard passed.")
          PY
