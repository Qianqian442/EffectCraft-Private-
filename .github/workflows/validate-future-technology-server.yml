name: Validate 未来科技 account server

on:
  push:
    branches: [main]
    paths:
      - 'server/cloudflare/**'
      - '.github/workflows/validate-future-technology-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check server/cloudflare/src/index.js
      - name: Validate D1 SQL schema with SQLite parser
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("server/cloudflare/schema.sql").read_text(encoding="utf-8"))
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"accounts", "devices", "sessions", "bans", "admin_audit", "settings", "login_rate_limits"}
          assert required <= tables, f"Missing tables: {sorted(required - tables)}"
          print("D1 account, session, allowlist, ban and audit schema verified.")
          PY
      - name: Ensure the bootstrap password is never hardcoded
        run: |
          grep -Fq 'env.ADMIN_BOOTSTRAP_PASSWORD' server/cloudflare/src/index.js
          ! grep -R -E 'qw123456789erasrt|qw1234567eras' server/cloudflare android
          echo "Bootstrap password is read only from a private server secret."
