name: Compile and validate Future Technology Android changes

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "server/cloudflare/**"
      - "tools/verify_future_tech_import.py"
      - ".github/workflows/compile-future-technology.yml"
  pull_request:
    paths:
      - "android/**"
      - "server/cloudflare/**"
      - "tools/verify_future_tech_import.py"
      - ".github/workflows/compile-future-technology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: future-technology-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run source boundary and marketplace checks
        run: |
          set -euo pipefail
          python tools/verify_future_tech_import.py
          python tools/validate_sources.py
          node --check server/cloudflare/src/index.js
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("server/cloudflare/schema.sql").read_text(encoding="utf-8"))
          cols = {row[1] for row in db.execute("PRAGMA table_info(software_catalog)")}
          required = {"id","name","publisher","version","architecture","package_type","source_url","sha256","expected_bytes","redistribution_allowed","is_active"}
          assert required <= cols, required - cols
          print("D1 marketplace schema applied and required catalogue columns verified.")
          PY

      - name: Compile main and administrator APKs (no release artifacts)
        working-directory: android
        env:
          FUTURE_TECH_API_BASE: ${{ vars.FUTURE_TECH_API_BASE || '' }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :main-app:assembleDebug :admin-app:assembleDebug
          test -s main-app/build/outputs/apk/debug/main-app-debug.apk
          test -s admin-app/build/outputs/apk/debug/admin-app-debug.apk
          echo "Both APK projects compiled. This verification workflow intentionally does not publish or label these as final installers."
