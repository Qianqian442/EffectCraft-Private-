name: Build Future Technology Android apps

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'server/cloudflare/**'
      - '.github/workflows/build-future-tech.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check server/cloudflare/src/index.js
      - name: Validate D1 schema in SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("server/cloudflare/schema.sql").read_text())
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"accounts", "devices", "sessions", "bans", "admin_audit", "settings", "login_rate_limits"}
          assert expected <= tables, expected - tables
          print("D1 schema validation passed.")
          PY
      - name: Validate account API contract JSON
        run: python -m json.tool schemas/future-tech-account-api.json > /dev/null

  build-apks:
    needs: validate-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUTURE_TECH_API_BASE: \${{ vars.FUTURE_TECH_API_BASE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile both APKs
        working-directory: android
        run: gradle --no-daemon :main-app:assembleDebug :admin-app:assembleDebug :shared:assembleDebug
      - name: Verify APK outputs
        run: |
          set -euo pipefail
          test -s android/main-app/build/outputs/apk/debug/main-app-debug.apk
          test -s android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
          file android/main-app/build/outputs/apk/debug/main-app-debug.apk
          file android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
      - name: Upload 未来科技 main APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureTechnology-main-debug-APK
          path: android/main-app/build/outputs/apk/debug/main-app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload 未来科技管理版 APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureTechnology-admin-debug-APK
          path: android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
          if-no-files-found: error
          retention-days: 30
