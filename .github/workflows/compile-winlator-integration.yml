name: Compile Future Technology with internal Winlator runtime

on:
  push:
    branches: [runtime-integration]
    paths:
      - "android/**"
      - "third_party/winlator"
      - "tools/prepare_winlator_runtime.py"
      - ".gitmodules"
      - ".github/workflows/compile-winlator-integration.yml"
  pull_request:
    paths:
      - "android/**"
      - "third_party/winlator"
      - "tools/prepare_winlator_runtime.py"
      - ".gitmodules"
      - ".github/workflows/compile-winlator-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: future-tech-winlator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Future Technology and pinned Winlator submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Prepare Winlator as a non-launcher Android library
        run: |
          set -euo pipefail
          python tools/prepare_winlator_runtime.py
          python - <<'PY'
          from pathlib import Path
          root = Path("android/winlator-runtime")
          print("module exists:", root.is_dir())
          print("Gradle exists:", (root / "build.gradle").is_file())
          print("Manifest exists:", (root / "src/main/AndroidManifest.xml").is_file())
          print("RootFS exists:", (root / "src/main/assets/rootfs.tzst").is_file())
          jni = root / "src/main/jniLibs/arm64-v8a"
          print("ARM64 JNI directory exists:", jni.is_dir())
          if jni.is_dir():
              for item in sorted(jni.rglob("*")):
                  if item.is_file():
                      print("JNI:", item.relative_to(root), item.stat().st_size)
          if (root / "build.gradle").is_file():
              print((root / "build.gradle").read_text(encoding="utf-8")[:6000])
          PY

      - name: Verify marketplace and project separation rules
        run: python tools/verify_future_tech_import.py

      - name: Compile Winlator runtime library and both Future Technology apps
        working-directory: android
        env:
          FUTURE_TECH_API_BASE: ${{ vars.FUTURE_TECH_API_BASE || '' }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :winlator-runtime:assembleDebug :main-app:assembleDebug :admin-app:assembleDebug
          test -s winlator-runtime/build/outputs/aar/winlator-runtime-debug.aar
          test -s main-app/build/outputs/apk/debug/main-app-debug.apk
          test -s admin-app/build/outputs/apk/debug/admin-app-debug.apk

      - name: Confirm ARM64 native runtime outputs
        working-directory: android
        run: |
          set -euo pipefail
          unzip -l winlator-runtime/build/outputs/aar/winlator-runtime-debug.aar | grep -E 'jni/arm64-v8a/.*[.]so' | head -n 30

      - name: Verify installable ARM64 APK contents
        working-directory: android
        run: |
          set -euo pipefail
          unzip -l main-app/build/outputs/apk/debug/main-app-debug.apk | grep -E 'lib/arm64-v8a/.*[.]so' | head -n 30
          mkdir -p ../artifacts
          cp main-app/build/outputs/apk/debug/main-app-debug.apk ../artifacts/Future-Technology-ARM64-debug.apk
          cp admin-app/build/outputs/apk/debug/admin-app-debug.apk ../artifacts/Future-Technology-Admin-ARM64-debug.apk
          cd ../artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat > BUILD-NOTES.txt <<'EOF'
          Future Technology ARM64 debug review build.
          Includes the integrated Winlator runtime module and the Future Technology Windows installer bridge.
          This is a debug-signed review APK, not a production release signature.
          Android device installation, first-boot rootfs initialization, graphics/audio compatibility,
          x86 and x86_64 Windows application compatibility, and Android launcher shortcut behavior
          still require real-device validation.
          Source branch: runtime-integration
          EOF

      - name: Upload installable ARM64 review APKs
        uses: actions/upload-artifact@v4
        with:
          name: Future-Technology-Android-APKs-review
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Record remaining real-device validation scope
        run: echo "Installable ARM64 review APKs are uploaded; this is not a production-signed or device-validated release."
