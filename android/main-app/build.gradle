plugins { id 'com.android.application' }

def apiBase = (project.findProperty("futureTechApiBase") ?: System.getenv("FUTURE_TECH_API_BASE") ?: "").toString()
def escapedApiBase = apiBase.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace 'com.futuretech.main'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.futuretech.main'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'API_BASE_URL', "\"\${escapedApiBase}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    dependencies { implementation project(':shared') }
}
