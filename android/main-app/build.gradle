plugins { id 'com.android.application' }

// Materialize the user's supplied launcher image before Android resource compilation.
def futureTechIconSource = file("src/main/icon/future_tech_icon.jpg.b64")
def futureTechIconTarget = file("src/main/res/drawable-nodpi/future_tech_icon.jpg")
def marketplaceIconSource = file("src/main/icon/computer_marketplace_icon.webp.b64")
def marketplaceIconTarget = file("src/main/res/drawable-nodpi/computer_marketplace_icon.webp")
tasks.register("materializeFutureTechIcon") {
    inputs.file(futureTechIconSource)
    outputs.file(futureTechIconTarget)
    doLast {
        if (!futureTechIconSource.isFile()) throw new GradleException("Future Technology logo asset is missing")
        def encoded = futureTechIconSource.getText("UTF-8").replaceAll("\\s+", "")
        futureTechIconTarget.parentFile.mkdirs()
        futureTechIconTarget.bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}
tasks.register("materializeComputerMarketplaceIcon") {
    inputs.file(marketplaceIconSource)
    outputs.file(marketplaceIconTarget)
    doLast {
        if (!marketplaceIconSource.isFile()) throw new GradleException("Computer marketplace icon asset is missing")
        def encoded = marketplaceIconSource.getText("UTF-8").replaceAll("\\s+", "")
        marketplaceIconTarget.parentFile.mkdirs()
        marketplaceIconTarget.bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}
tasks.named("preBuild").configure {
    dependsOn("materializeFutureTechIcon", "materializeComputerMarketplaceIcon")
}

def apiBase = (project.findProperty("futureTechApiBase") ?: System.getenv("FUTURE_TECH_API_BASE") ?: "").toString()
def escapedApiBase = apiBase.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace 'com.futuretech.main'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.futuretech.main'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${escapedApiBase}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':shared')
    if (rootProject.findProject(":winlator-runtime") != null) {
        implementation project(":winlator-runtime")
    }
}
